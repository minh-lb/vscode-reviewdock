name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:traceability
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package
      - run: npm run format:check
  extension-host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode-version: ['1.140.0', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a npm run test:extension
        if: runner.os == 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
      - run: npm run test:extension
        if: runner.os != 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
  tag-version:
    name: Release validated version on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, extension-host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Create version tag if missing
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git ls-remote --tags --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists; leaving it unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "ReviewDock ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi
      - name: Check for existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "create=false" >> "${GITHUB_OUTPUT}"
            echo "${TAG} release already exists."
          else
            echo "create=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build release package
        if: steps.release.outputs.create == 'true'
        run: |
          npm ci
          npm run build
          npm run package
      - name: Create GitHub release with VSIX
        if: steps.release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release create "${TAG}" "reviewdock-${VERSION}.vsix" \
            --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "ReviewDock ${VERSION}" --generate-notes
      - name: Trigger Marketplace publishing workflow
        if: steps.release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          gh workflow run publish.yml --ref main --repo "${GITHUB_REPOSITORY}" -f tag="v${VERSION}"
