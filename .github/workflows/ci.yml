name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:traceability
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package
      - run: npm run format:check
  extension-host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode-version: ['1.140.0', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a npm run test:extension
        if: runner.os == 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
      - run: npm run test:extension
        if: runner.os != 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
  release-tag:
    name: Release manually pushed version tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, extension-host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify manually pushed tag and source commit
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${EXPECTED_TAG}"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Release tag must point to a commit on main"
            exit 1
          fi
      - name: Check for existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "create=false" >> "${GITHUB_OUTPUT}"
            echo "${GITHUB_REF_NAME} release already exists."
          else
            echo "create=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Build release package
        if: steps.release.outputs.create == 'true'
        run: |
          npm ci
          npm run build
          npm run package
      - name: Create GitHub release with VSIX
        if: steps.release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          gh release create "${GITHUB_REF_NAME}" "reviewdock-${VERSION}.vsix" \
            --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "ReviewDock ${VERSION}" --generate-notes
      - name: Trigger Marketplace publishing workflow
        if: steps.release.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml --ref main --repo "${GITHUB_REPOSITORY}" -f tag="${GITHUB_REF_NAME}"
